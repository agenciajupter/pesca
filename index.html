<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F9FA">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Cardume">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<title>Cardume · pesca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script>
/* aplica o tema antes de pintar a tela (evita piscar) */
(function(){var m='auto',t='md',mo='on';try{var c=JSON.parse(localStorage.getItem('cardume.settings')||'{}');m=c.theme||'auto';t=c.text||'md';mo=c.motion||'on'}catch(e){}
var r=document.documentElement,v=r.getAttribute('data-theme'),d=m==='dark'||(m==='auto'&&(v?v==='dark':matchMedia('(prefers-color-scheme: dark)').matches));
r.setAttribute('data-scheme',d?'dark':'light');r.setAttribute('data-text',t);r.setAttribute('data-motion',mo)})();
</script>
</head>
<body>
<div class="app" id="app">
  <main id="v-inicio" class="view"></main>
  <main id="v-previsao" class="view" hidden></main>
  <main id="v-mapa" class="view" hidden style="overflow:hidden"></main>
  <main id="v-comunidade" class="view" hidden></main>
  <main id="v-perfil" class="view" hidden></main>
  <button class="fab" id="fab" aria-label="Registrar captura ou iniciar pescaria"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <nav class="nav" id="nav" aria-label="Navegação principal">
    <a href="#inicio" data-r="inicio"><span class="pill"><svg class="i" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg></span>Início</a>
    <a href="#previsao" data-r="previsao"><span class="pill"><svg class="i" viewBox="0 0 24 24"><path d="M2 15c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6 0"/><path d="M2 19c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6 0"/><path d="M15 4.5a4.5 4.5 0 1 0 4.4 5.5A3.6 3.6 0 0 1 15 4.5z"/></svg></span>Previsão</a>
    <a href="#mapa" data-r="mapa"><span class="pill"><svg class="i" viewBox="0 0 24 24"><path d="M9 4 3 6.5v13L9 17l6 2.5 6-2.5v-13L15 6.5z"/><path d="M9 4v13M15 6.5v13"/></svg></span>Mapa</a>
    <a href="#comunidade" data-r="comunidade"><span class="pill"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c.6-3.3 3-5 6-5s5.4 1.7 6 5"/><path d="M16 4.8a3 3 0 0 1 0 6.2M18 14.3c1.7.6 2.8 2.1 3 4.7"/></svg></span>Comunidade</a>
    <a href="#perfil" data-r="perfil"><span class="pill"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c.8-3.9 3.8-6 7.5-6s6.7 2.1 7.5 6"/></svg></span>Perfil</a>
  </nav>
  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="sh"><h2 id="sheetTitle"></h2><button class="iconbtn" id="sheetClose" aria-label="Fechar"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div class="sb" id="sheetBody"></div></section>
  <section class="sheet full" id="page" role="dialog" aria-modal="true"><div class="sb" id="pageBody"></div></section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script src="js/config.js"></script>
<script src="js/platform.js"></script>
<script src="js/astro.js"></script>
<script src="js/moon.js"></script>
<script src="js/env.js"></script>
<script src="js/species.js"></script>
<script src="js/app.js"></script>
<script src="js/realmap.js"></script>
<script src="js/map.js"></script>
<script src="js/social.js"></script>
</body>
</html>
